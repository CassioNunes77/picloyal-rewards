# Build e publicação para o Cartão Fidelidade
# Nota: este projeto NÃO usa submodules. Se o build falhar com "submodule fetch",
# em Netlify: Deploy settings → Clear cache and retry deploy.
[build]
  command = "npm run build"
  publish = "dist"

# Garante que a SPA sempre receba index.html (fallback)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
