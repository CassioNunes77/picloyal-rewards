<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Core+</title>
    <meta name="description" content="Seu cartão de fidelidade digital com descontos exclusivos" />
    <meta name="author" content="Core+" />

    <meta property="og:title" content="Core+" />
    <meta property="og:description" content="Seu cartão de fidelidade digital com descontos exclusivos" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/pwa-512x512.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@Lovable" />
    <meta name="twitter:image" content="/pwa-512x512.png" />

    <!-- Favicon e ícones - Compatibilidade Safari e outros navegadores -->
    <!-- Favicon padrão (deve vir primeiro para compatibilidade máxima) -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="shortcut icon" type="image/png" href="/favicon.png" />
    <link rel="icon" type="image/png" href="/favicon.ico" />
    
    <!-- Múltiplos tamanhos para diferentes navegadores e contextos -->
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="128x128" href="/favicon.png" />
    
    <!-- PWA Icons -->
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon.png" />
    
    <!-- Apple Touch Icon para iOS Safari (obrigatório para Safari iOS) -->
    <!-- Safari procura no root, então usar caminho absoluto -->
    <link rel="apple-touch-icon" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="144x144" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="120x120" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="114x114" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="76x76" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="72x72" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="60x60" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="57x57" href="/favicon.png" />
    
    <!-- Safari específico: mask-icon para Safari pinned tabs (cor roxa do logo) -->
    <link rel="mask-icon" href="/favicon.png" color="#7c3aed" />
    
    <!-- Safari macOS: SVG favicon para melhor qualidade -->
    <link rel="icon" type="image/svg+xml" href="/favicon.png" />

    <!-- PWA Meta Tags for iOS -->
    <meta name="theme-color" content="#7c3aed" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Fidelidade" />
    
    <!-- Splash screens for iOS -->
    <link rel="apple-touch-startup-image" href="/apple-touch-icon.png" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
